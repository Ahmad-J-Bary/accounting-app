[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/ports",
    "crates/tauri-adapter", "icon-gen",
    # "crates/accounting",
    # "crates/inventory",
    # "crates/sales",
    # "crates/purchases",
    # "crates/payments",
    # "crates/reporting",
    # "crates/auth",
]
exclude = [
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["ERP Team"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "macros"] }
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }

[profile.release]
lto = true
codegen-units = 1
strip = true
