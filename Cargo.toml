[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/tauri-adapter",
    "apps/desktop/src-tauri",
]
exclude = []

[workspace.package]
edition = "2021"
version = "0.9.11"
authors = ["Ahmad Abdelbary"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "macros", "rust_decimal", "chrono", "uuid"] }
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }

[profile.dev]
opt-level = 0

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
codegen-units = 1
strip = true
