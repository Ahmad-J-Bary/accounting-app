[package]
name = "desktop"
version = "0.9.0"
edition = "2021"
authors = ["Ahmad Abdelbary"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["wry", "custom-protocol"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

tauri-adapter = { path = "../../../crates/tauri-adapter" }

# Required on Linux for gdk-pixbuf workaround (see main.rs)
[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
